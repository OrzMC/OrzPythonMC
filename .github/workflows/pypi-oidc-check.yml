name: PyPI OIDC preflight

# 手动预检:本机不可能验证 PyPI 的 Trusted Publisher 是否配好(需要真实 OIDC 交换),
# 而等到下一次发版才发现配错代价太高。`uv publish --dry-run --trusted-publishing always`
# 会真的去 https://upload.pypi.org/_/oidc/mint-token 换 token(只是不上传文件)——
# 本地跑会报 "No OIDC token discovered",在 Actions 里跑就能如实反映配置正确与否。
#
# PyPI 侧需要(两个项目各配一次):项目 → Settings → Publishing → Add a new publisher
#   Owner = 本仓库 owner,Repository = 本仓库名,Workflow name = release.yml,
#   Environment name = release(必须与 release.yml 的 pypi job 一致)。

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 的硬前提

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 与 release.yml 的 pypi job 同环境:PyPI 的 publisher 配置里要匹配环境名。
    environment: release
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build distributions
        run: uv build --all-packages
      - name: Check the OIDC exchange for both projects
        run: |
          set -uo pipefail
          failed=0
          for spec in "orzmc:dist/orzmc-*" "orzmc_app:dist/orzmc_app-*"; do
            package="${spec%%:*}"
            files="${spec#*:}"
            echo "== ${package} =="
            if uv publish --dry-run --trusted-publishing always "${files}"; then
              echo "OK: ${package} 的 OIDC 交换成功 —— Trusted Publisher 已配置"
            else
              echo "::error::${package} 的 OIDC 交换失败:请在 PyPI 项目 ${package} 的 Settings → Publishing 里补上 publisher(Workflow name 必须是 release.yml,Environment name 必须是 release)"
              failed=1
            fi
          done
          if [ "${failed}" = "0" ]; then
            echo "结论:两个包的 OIDC 都可用,可以把 release.yml 里的 API token 换成 Trusted Publisher(已经是)并删除 PYPI_API_TOKEN_* secrets。"
          fi
          exit "${failed}"
      - name: Dump the raw PyPI response (diagnostic)
        # uv 只说 "Failed to obtain token",不转述 PyPI 的原因;直接自己换一次 token
        # 并把 PyPI 的原始 JSON 打出来 —— 字段填错时它会把不匹配的那一项点名。
        if: failure()
        run: |
          set -uo pipefail
          id_token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "GitHub OIDC token 已取得(前 40 字符): ${id_token:0:40}…"
          echo "=== PyPI 对 mint-token 的原始响应 ==="
          curl -sS -X POST "https://upload.pypi.org/_/oidc/mint-token" \
            -H 'Content-Type: application/json' \
            -d "{\"token\": \"${id_token}\"}" \
            | head -c 2000
          echo
