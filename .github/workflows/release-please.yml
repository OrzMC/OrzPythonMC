name: Release Please

# 人只管写 Conventional Commits;机器人维护一个 release PR(自动 bump 版本 +
# 生成 CHANGELOG.md)。合并该 PR = 按下发版按钮 → 自动打 tag + 建带 notes 的
# GitHub Release → 触发 release.yml 构建 6 平台二进制并发布 PyPI。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # 接力 dispatch release.yml(GITHUB_TOKEN 建的 tag 不会触发工作流)

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 接力步骤要读 .release-please-manifest.json(release-please action 自己不 checkout)。
      - uses: actions/checkout@v7
      # RELEASE_PLEASE_TOKEN 是可选的可选优化:用 PAT 建的 release PR 才会触发
      # CI(GITHUB_TOKEN 建的 PR 按设计不触发工作流)。没有它也能用,只是 release
      # PR 上没有检查——发版提交只含版本号与 CHANGELOG,风险低。
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # 关键:GITHUB_TOKEN 建的 tag/release **不会触发新的工作流运行**(GitHub 的
      # 递归保护),所以 release.yml 的 `push: tags` 永远不会自己响 —— 必须显式接力。
      # 判据用「manifest 里的版本对应的 release 是否已有产物」而不是 action 的
      # outputs:manifest 模式下的 output 名带包路径前缀(`.--release_created`),
      # 而按现状推断是幂等且自愈的(产物缺失就补跑,已存在就什么都不做)。
      - name: Kick off the release pipeline when the tag has no binaries yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          tag="v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "no GitHub release for ${tag} yet — nothing to release"
            exit 0
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'orzmc-linux-x86_64'; then
            echo "${tag} already carries binaries — nothing to do"
            exit 0
          fi
          echo "tag ${tag} exists without binaries — dispatching the release pipeline"
          gh workflow run release.yml --ref "${{ github.event.repository.default_branch }}" -f tag="$tag"

