name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  # 发版后立刻刷新官网:页面里的"最新版"是部署期注入的,不重新部署就会停在旧版本。
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要注入 index.html 的版本 tag(如 v2.2.1);留空则用 releases/latest 解析"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只保留一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Strip UTF-8 BOM from install.ps1 (fixes irm | iex)
        run: |
          # The repo file keeps its BOM so `powershell -File` reads UTF-8
          # correctly on zh-CN codepage machines. But `irm ... | iex` evaluates
          # the served content as a string, and a leading U+FEFF turns the
          # first line into a bogus command (The term 'Windows' is not
          # recognized). Strip it from the deployed copy only.
          python3 -c "from pathlib import Path; p=Path('docs/install.ps1'); b=p.read_bytes(); p.write_bytes(b[3:] if b[:3]==b'\xef\xbb\xbf' else b)"
      - name: Inject the latest release tag into index.html
        run: |
          set -euo pipefail
          # 优先用发布流水线显式传进来的 tag:releases/latest 的解析(GitHub 的
          # "latest" 标记 + CDN 缓存)可能滞后几十秒,刚发完版就部署会注入**上一个**版本
          # (真发生过:v2.2.1 发布后的那次部署注入的仍是 v2.2.0)。
          tag="${{ inputs.tag }}"
          if [ -z "${tag}" ]; then
            # 否则用非 API 的 302 端点解析(REST API 限流 60 次/时/IP,CI 与共享出口必中)。
            # 注意不能带 -L:跟随重定向后 %{redirect_url} 会是空串 —— 与 install.sh 同一个坑。
            redirect="$(curl -sS -o /dev/null -w '%{redirect_url}' "https://github.com/${GITHUB_REPOSITORY}/releases/latest" || true)"
            case "$redirect" in
              */releases/tag/*) tag="${redirect##*/releases/tag/}" ;;
              *)
                echo "::warning::无法解析最新 release tag(仓库还没有 release?),页面保留占位符并回退到 GitHub API"
                exit 0
                ;;
            esac
          fi
          grep -q '__ORZMC_LATEST_TAG__' docs/index.html || {
            echo "::error::docs/index.html 缺少 __ORZMC_LATEST_TAG__ 占位符,无法注入最新版本"
            exit 1
          }
          sed -i "s|__ORZMC_LATEST_TAG__|${tag}|g" docs/index.html
          echo "injected latest tag: ${tag}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
