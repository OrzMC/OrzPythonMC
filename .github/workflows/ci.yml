name: CI

on:
  push:
    branches: [main]
    # 纯文档/CHANGELOG 提交不跑 6 平台矩阵（实测：一次 CI 约 4–5 分钟）。
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    # 注意:**不能**用 `branches-ignore: release-please--**` 把 release PR 整条跳过。
    # main 的分支保护要求 `pr-title` / `quality` / `test (ubuntu-latest, x86_64)`,
    # 工作流不跑 = 必需检查永不上报 = release PR 永久 BLOCKED(2026-10-19 实测:
    # #75 卡死,只能 admin 绕过)。实测代价:PR 上本来就不跑 `binary`/`installer`
    # (push-only),剩下的 test 矩阵**并行**,墙钟与跑单条腿差不多,所以直接照跑。
  # 合前重验收的正规入口:不跑本工作流的源分支上,也能随时把「6 平台二进制 +
  # 安装器 e2e」跑一遍(以前只能临时把分支加进 push.branches,那种改触发条件的
  # 做法容易误合进 main)。
  #   gh workflow run ci.yml --ref <branch> -f full=true
  workflow_dispatch:
    inputs:
      full:
        description: 追加 push-only 的重活(binary + installer 6 平台矩阵)
        type: boolean
        default: false
  workflow_call:
    inputs:
      # Release reuses this workflow as its quality gate; the 6-platform test
      # matrix already ran on main, so the tag only needs the single-runner checks.
      skip-test-matrix:
        type: boolean
        required: false
        default: false
      full:
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 标题就是 squash 提交的标题,而 release-please 用 conventional-commits 解析它。
  # 实测:标题里出现**带空格的括号**(如 `(PyPI provenance)`)会让解析器整条放弃
  # (`unexpected token ' ' ... valid tokens [)]`),后果是这个 feat/fix 既不进 changelog
  # 也不触发版本号 —— 而且没有任何红灯。所以在合并前拦下。
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR title must be a parseable Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # 用 python3 而不是 grep -P:BSD/macOS 的 grep 没有 -P,那样本地测不了、
        # 守卫会假通过(写这条时就踩过)。
        run: |
          python3 - <<'PY'
          import os, re, sys

          title = os.environ["TITLE"]
          if re.search(r"\([^)]*\s[^)]*\)", title):
              print(
                  "::error::PR 标题里的括号不能含空格(如 `(PyPI provenance)`)—— "
                  "release-please 的解析器会整条放弃这条提交:不进 changelog、不触发版本号,"
                  "而且没有任何红灯。改用冒号/连字符或去掉括号。"
              )
              sys.exit(1)
          if not re.match(r"^(feat|fix|perf|refactor|docs|chore|ci|test|build|style|revert)(\([^)]+\))?!?: .+", title):
              print("::error::PR 标题不符合 Conventional Commits,例如 `feat(download): 支持断点续传`")
              sys.exit(1)
          print(f"标题可用(会成为 squash 提交): {title}")
          PY

  # Platform-independent checks: run once, fail fast before fanning out.
  # 能力台账校验（两套 CLI 并行期，见父仓库 docs/two-cli-strategy.md）：
  # 用本实现的 capabilities 反向验证 docs/spec/parity.json 的声明
  # （标 parity 必须真有、标 na 不许有），防止实现悄悄漂移。
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout parent (spec + ledger)
        uses: actions/checkout@v4
        with:
          repository: OrzMC/OrzMC
          path: parent
          sparse-checkout: |
            docs/spec
            scripts/verify
            scripts/accept
      - uses: astral-sh/setup-uv@v5
      - name: Verify ledger against capabilities
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run orzmc --json capabilities > /tmp/caps.json
          python3 parent/scripts/verify/parity.py --python-caps /tmp/caps.json

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: MyPy
        run: uv run mypy
      - name: Tests
        run: uv run --all-packages pytest

      # 命令面与行为契约都在父仓库的规范里:检出它,既给 surface 校验用 manifest,
      # 也给 CLI 验收用 state-paths.json(补全落点逐项比对)。
      - name: Checkout parent (spec manifest / snapshots)
        uses: actions/checkout@v7
        with:
          repository: OrzMC/OrzMC
          path: parent

      # CLI 行为验收(规范面):信封 / 退出码 / 取消语义 / 补全落点 / MCP,全部走
      # **真实进程**。unit test 用 CliRunner 在进程内调用,覆盖不到进程退出码、
      # 非 TTY 分支、真实文件落点 —— 这里补上。
      - name: Resolve the CLI entry point
        # 源码模式的被测物直接给**入口脚本绝对路径**：沙箱会清空环境并切 cwd，
        # 在沙箱里跑 `uv run ...` 解析不到项目（实测 "Failed to spawn: orzmc"）。
        run: |
          set -euo pipefail
          bin="$(uv run --all-packages python -c 'import shutil; print(shutil.which("orzmc"))')"
          test -n "$bin" || { echo "::error::找不到 orzmc 入口脚本"; exit 1; }
          echo "ORZMC_BIN=$bin" >> "$GITHUB_ENV"
          echo "被测入口: $bin"

      - name: CLI acceptance (source mode)
        # M2：验收脚本只有一份，在父仓库（`docs/two-cli-strategy.md`）。
        run: |
          python3 parent/scripts/accept/cli.py \
            --cli "$ORZMC_BIN" \
            --state-paths parent/docs/spec/state-paths.json
      - name: Build both packages
        run: uv build --all-packages

      - name: CLI surface check (strict)
        run: |
          uv run --all-packages orzmc --json capabilities > "$RUNNER_TEMP/caps.json"
          python3 parent/scripts/verify/surface.py \
            --implementation python \
            --capabilities "$RUNNER_TEMP/caps.json" \
            --strict

  # Pure-Python tests with fakes, but they exercise OS-sensitive paths
  # (path sep, platform.machine, subprocess creation flags, zip/tar extract)
  # — worth the full 6-platform sweep to catch OS bugs cheaply.
  test:
    needs: quality
    # inputs 上下文仅在 workflow_call 触发时存在;push/PR 时用 || 'false' 兜底,
    # 避免直接引用 inputs.* 在非 workflow_call 触发下解析为空。
    if: ${{ !fromJSON(inputs.skip-test-matrix || 'false') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Tests
        run: uv run --all-packages pytest

  # PyInstaller packaging is OS/arch-specific — verify a build works on all 6
  # platforms after every merge to main (not per-PR: keeps PR CI fast). The
  # branch check keeps this from running on release tag pushes; `full=true`
  # (workflow_dispatch / workflow_call) opts in on demand.
  binary:
    needs: quality
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || inputs.full == true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    timeout-minutes: 30
    # only-managed 兜底:macOS runner 镜像预装 framework Python,uv 默认会退回
    # 系统解释器 → PyInstaller framework 模式(启动 ~14s)。强制 uv 只用 standalone。
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build binary
        run: uv run --package orzmc-app python scripts/build.py
      # macOS:framework 模式构建会链接 Python.framework,产物启动 ~14s(embed ~1.5s)。
      # 断言产物不链接它,让慢二进制永远发不出去。
      - name: Assert embed-mode build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          if otool -L dist/orzmc* | grep -q "Python.framework"; then
            echo "::error::Binary links Python.framework (framework-mode PyInstaller, ~14s startup). Check pyproject.toml [tool.uv] python-preference = \"only-managed\"."
            exit 1
          fi
      # 冻结二进制的 CLI 验收。单测全绿但**发布二进制**崩过的例子:
      # 2.11.0 及更早的 `completion install` / `--show-completion` —— typer 的补全
      # 安装走 shellingham,而它用 `importlib.import_module(f".{os.name}")` 动态导入子
      # 模块,PyInstaller 静态分析看不到 → 冻结点缺 `shellingham.posix`/`nt` →
      # RuntimeError。`scripts/build.py` 已 `--collect-submodules shellingham`,
      # 这里在「真的二进制」上把补全 / 信封 / MCP / 取消语义全跑一遍兜住回归。
      # 验收脚本只有一份，在父仓库（`docs/two-cli-strategy.md` M2）。**必须**先检出：
      # 少了这一步 `parent/scripts/accept/cli.py` 不存在，frozen 验收直接报 404 ——
      # 2026-10-20 抓到：main push 上的 `binary` job 一直这样红，等于 PyInstaller 资产从未被验收。
      - name: Checkout parent (acceptance harness + spec)
        uses: actions/checkout@v7
        with:
          repository: OrzMC/OrzMC
          path: parent

      - name: CLI acceptance (frozen binary)
        # 冻结二进制专属用例（PyInstaller 通路）用 `--frozen` 打开。
        run: |
          # 一条命令写完:Windows runner 默认 shell 是 pwsh,`\` 不是续行(反引号才是),
          # 拆成两行会报 `ParserError ... .ps1:3`(2026-10-20 实测)。
          python3 parent/scripts/accept/cli.py --cli dist/orzmc --frozen --state-paths parent/docs/spec/state-paths.json
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: orzmc-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/orzmc*
          if-no-files-found: error

  # End-to-end installer check on all 6 platforms: build the binary locally,
  # install via the one-line installer (--file seam + hermetic env so we never
  # touch the real PATH/rc/user dirs), run `orzmc uninstall --yes`, and
  # assert the binary + install manifest are gone. Push-only like `binary`:
  # the latest released binary predates uninstall, so e2e must use a
  # local build (the "chicken-and-egg" seam) rather than pulling a release.
  installer:
    needs: quality
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || inputs.full == true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-managed
      # `orzmc update --check` reads the Releases API from the *built binary*;
      # the unauthenticated limit (60/h/IP) is shared with every other job on
      # the runner's egress IP, so give it a token (the library honours
      # GITHUB_TOKEN / GH_TOKEN and still works without one).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build binary
        run: uv run --package orzmc-app python scripts/build.py

      # Installer + self-update e2e: one cross-platform harness covers install
      # --file into an isolated temp dir → update --check → update --file (the
      # detached helper really swaps the binary) → real release download →
      # failure path → dev guard → piped entry (irm | iex / curl | sh, served
      # with GitHub-Pages-like content types) → uninstall. PATH / shell rc
      # / user dirs are never touched.
      - name: Installer + self-update e2e (Unix)
        if: runner.os != 'Windows'
        run: uv run python scripts/accept_selfupdate.py --skip-build
      # Windows runs it once per PowerShell flavour: 5.1 is the shell users get
      # by default and the one that byte-decodes an octet-stream .ps1 source
      # (the installer's encoding self-heal must recover it); 7.x is the modern
      # shell. Both are asserted, including their PSEdition/version.
      - name: Installer + self-update e2e (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        run: uv run python scripts/accept_selfupdate.py --skip-build --powershell powershell --expect-ps-major 5
      - name: Installer + self-update e2e (PowerShell 7)
        if: runner.os == 'Windows'
        run: uv run python scripts/accept_selfupdate.py --skip-build --powershell pwsh --expect-ps-major 7
