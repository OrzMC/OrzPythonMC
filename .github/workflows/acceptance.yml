name: Acceptance

on:
  schedule:
    # Daily 04:23 UTC — primary suite only (latest × all types × 6 platforms).
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: primary = 最新版全类型;full = primary + 旧版本后向兼容冒烟
        default: primary
        options: [primary, full]
      backcompat_versions:
        type: string
        description: full 时旧版本列表(逗号分隔),每版跑 server/client vanilla 冒烟
        default: "1.20.4"
      deep-client:
        type: boolean
        description: 客户端追加 15s java 存活检查(CI 的 macOS/Windows 无 GL,可能假阴性,真机手动用)
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 真实验收要真实下载(Java + client assets + jars),游戏 root 按 OS/arch 缓存,
# 夜间只取增量;headless Linux 的客户端需要 xvfb 虚拟显示。
# 平台:macOS/Linux/Windows × x86_64/arm64(与 ci.yml 一致)。

jobs:
  # 主基准:最新版本 × 全部类型 × 6 平台。类型暂未适配最新版时 harness 记 SKIP
  # (如 Forge 通常滞后一个稳定版),最新版仍是 vanilla/paper/fabric 的主战场;
  # 上游无该平台产物(Adoptium 无某 arch 的 Java / Mojang 无某 arch 的 natives)
  # 时记 UP(gap) —— 均不判失败,仅 FAIL/TIMEOUT 使工作流变红。
  primary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Cache game root (Java + assets + jars)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/orzmc-accept
          key: accept-primary-${{ runner.os }}-${{ runner.arch }}
      - name: Acceptance (latest × all types)
        env:
          # Windows runners pipe output through cp1252; UTF-8 avoids the codec
          # crash in the harness's Chinese messages (harness also reconfigures).
          PYTHONUTF8: "1"
        run: >-
          uv run --package orzmc-app python scripts/acceptance.py
          --root "${{ runner.temp }}/orzmc-accept"
          --case server:vanilla:latest
          --case server:paper:latest
          --case server:fabric:latest
          --case server:forge:latest
          --case client:vanilla:latest
          --case client:fabric:latest
          --case client:forge:latest
          ${{ inputs.deep-client && '--deep-client' || '' }}
      - name: Upload acceptance logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-logs-primary-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/orzmc-accept/logs
          if-no-files-found: warn

  # 后向兼容冒烟:旧版本 × vanilla server/client(证明 Mojang manifest/启动管线
  # 仍兼容该大版本)。仅手动 full 套件触发;平台取 x86_64 三平台省 arm64 配额。
  backcompat:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-15-intel
            arch: x86_64
          - os: windows-latest
            arch: x86_64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Cache game root (Java + assets + jars)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/orzmc-backcompat
          key: accept-backcompat-${{ runner.os }}-${{ runner.arch }}
      - name: Acceptance (old-version backcompat smoke)
        env:
          PYTHONUTF8: "1"
        run: >-
          uv run --package orzmc-app python scripts/acceptance.py
          --root "${{ runner.temp }}/orzmc-backcompat"
          --backcompat "${{ inputs.backcompat_versions }}"
          ${{ inputs.deep-client && '--deep-client' || '' }}
      - name: Upload acceptance logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-logs-backcompat-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/orzmc-backcompat/logs
          if-no-files-found: warn

  # 夜间验收失败没人会收到通知(GitHub 不主动通知 schedule 失败,仓库 60 天无
  # 活动后 cron 还会静默停) → 自动开一个 issue,已有同名 issue 就追加评论。
  notify:
    needs: [primary, backcompat]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = '真实验收失败(acceptance)';
            const body = [
              `工作流 ${context.workflow} 失败:${process.env.RUN_URL}`,
              `job 结果(primary, backcompat):${process.env.RESULTS}`,
              '',
              '判定语义:PASS 通过;UP(no Done) 世界生成卡死、SKIP 类型未适配该版本、',
              'UP(gap) 上游缺该平台产物 —— 以上均只是警告;只有 FAIL / TIMEOUT 判失败。',
              '定位:该 run 的 `acceptance-logs-*` artifact 与各 job 日志。',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
