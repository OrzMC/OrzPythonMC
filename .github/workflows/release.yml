name: Release

on:
  push:
    tags: ["v*"]
  # release-please 用 GITHUB_TOKEN 建的 tag **不会触发工作流**(GitHub 的递归保护:
  # 由 GITHUB_TOKEN 产生的事件不再触发新的工作流运行),所以它建完 tag 后必须显式
  # dispatch 本工作流(见 release-please.yml)。手动补发也用同一个入口:
  #   gh workflow run release.yml --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布/补发的 tag(如 v2.1.0)
        required: true
        type: string

permissions:
  contents: write
  actions: write # 收尾时 dispatch pages.yml(同样是 GITHUB_TOKEN 不触发事件的问题)

# 同一时间只允许一个发版流程碰同一个 tag(矩阵 job 之间共享 draft release)。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 发版第一道护栏:tag 必须与代码里的版本一致,且指向 main 上的提交。
  # 不一致的代价极高:客户端自升级用 `releases/latest` 的 tag 和二进制内嵌
  # `__version__` 比较,版本对不上会变成「下载→替换→重启后版本没变→再提示升级」
  # 的死循环;PyPI 元数据、官网 latest 卡片、安装记录都会跟着错。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要完整历史做 merge-base(判断 tag 是否落在 main 上)。
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag matches the version in orzmc/version.py
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' orzmc/orzmc/version.py)"
          if [ -z "$version" ]; then
            echo "::error::cannot read __version__ from orzmc/orzmc/version.py"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match v$version (orzmc/version.py). Bump the version first, then tag."
            exit 1
          fi
          echo "ok: $TAG == v$version"
      - name: Tag commit is on main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 用 git rev-parse HEAD,不能用 $GITHUB_SHA:手动 dispatch 时 GITHUB_SHA 是
          # **dispatch 那个分支**的提交,而这里 checkout 的是 tag(实测因此误报"不在 main")。
          # 用 FETCH_HEAD 而不是 origin/main:tag 上的 checkout 不一定有
          # refs/remotes/origin/main。
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "::error::tag $TAG points at $sha which is not on main — release from main only."
            exit 1
          fi
          echo "ok: $sha is on main"

  quality:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      # 6 平台 pytest 在 main push 已跑过;发版只取单 runner 质量门禁。
      skip-test-matrix: true

  # 先确保 Release 存在(draft),再挂二进制:
  #  - release-please 开的 release 已经带整理好的 notes 且已发布 → 原样不动;
  #  - 手动打 tag 时这里用 GitHub 生成的 notes 建 draft,发布前对用户不可见。
  prepare:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # gh release 需要 git 仓库上下文(否则 fatal: not a git repository);
      # --generate-notes 还要历史来算 diff。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Ensure a draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving its notes and draft state untouched"
          else
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi

  binary:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            artifact: orzmc-macos-x86_64
          - os: macos-15
            arch: arm64
            artifact: orzmc-macos-arm64
          - os: ubuntu-latest
            arch: x86_64
            artifact: orzmc-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact: orzmc-linux-arm64
          - os: windows-latest
            arch: x86_64
            artifact: orzmc-windows-x86_64
          - os: windows-11-arm
            arch: arm64
            artifact: orzmc-windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # macOS runner 镜像预装 framework Python,uv 默认退回系统解释器 →
    # PyInstaller framework 模式(启动 ~14s)。强制 uv 只用 standalone 的 embed 模式(~1.5s)。
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      # 必须钉到被发布的那个提交:手动 dispatch 时 github.ref 是**分支**,不钉 ref 会拿
      # 分支代码构建,再用 --clobber 覆盖正确产物(真踩过:2.2.0 的二进制自报 2.1.0)。
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build binary
        # --name 让每个平台产出独立文件名(orzmc-<os>-<arch>),Release 上不再互相覆盖
        run: uv run --package orzmc-app python scripts/build.py --name ${{ matrix.artifact }}
      - name: Assert embed-mode build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          if otool -L dist/orzmc* | grep -q "Python.framework"; then
            echo "::error::Binary links Python.framework (framework-mode PyInstaller, ~14s startup). Check pyproject.toml [tool.uv] python-preference = \"only-managed\"."
            exit 1
          fi
      - name: Assert the binary reports the released version
        # 最后一道防线:构建产物必须自报被发布的版本,否则说明构建用错了提交 ——
        # 这种错会以「发出去的二进制版本不对」的形式静默进入用户手里。
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          out="$(./dist/orzmc* version)"
          echo "$out"
          case "$out" in
            "orzmc ${TAG#v} "*|"orzmc ${TAG#v} "*) echo "ok: 自报版本与 $TAG 一致" ;;
            *) echo "::error::二进制自报版本与发布 tag 不一致:期望 $TAG,得到 $out"; exit 1 ;;
          esac
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/orzmc*
          if-no-files-found: error
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 这个 job 会在 Windows 上跑,shell 是 pwsh —— 那里 `$TAG` 是 PowerShell 变量
        # (空字符串),只有 `$env:TAG` 才是环境变量。用表达式内联最稳,与 shell 无关。
        run: gh release upload "${{ inputs.tag || github.ref_name }}" dist/orzmc* --clobber

  pypi:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    # PyPI Trusted Publisher(OIDC):job 级 permissions 会**覆盖**工作流级,所以这里要
    # 显式写全 —— contents: read 给 checkout,id-token: write 是换 OIDC token 的硬前提。
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build distributions
        run: uv build --all-packages
      # 按包拆分发布:每个包只用自己 scope 的 API token。
      # 注意 glob:dist/orzmc-* 不会误匹配 orzmc_app-*(下划线)。
      # 幂等:已在 PyPI 上的版本直接跳过 —— 发布流水线会因为「某个平台二进制失败」
      # 或「官网重部署失败」被重跑,而 PyPI 不允许覆盖同名版本,不跳过就会整条红。
      - name: Publish orzmc to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN_ORZMC_LIB }}
          PACKAGE: orzmc
        run: ./scripts/publish_idempotent.sh
      - name: Publish orzmc_app to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN_ORZMC_APP }}
          PACKAGE: orzmc_app
        run: ./scripts/publish_idempotent.sh

  # 收尾:二进制 + PyPI 全部落地后才让 Release 可见。
  # 半成品(有二进制、没 PyPI 包)不会出现在 releases/latest 上,官网与一键安装
  # 也不会提前把新版本推给用户。release-please 已发布的 release 上这是 no-op。
  publish:
    needs: [binary, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write # job 级 permissions 会覆盖工作流级,漏了它 gh workflow run 报 403
    steps:
      # 同上:gh release / gh workflow run 都需要仓库上下文,且要读被发布提交的内容。
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json tagName,isDraft,url \
            --jq '"published \(.tagName) draft=\(.isDraft) \(.url)"'
      # 官网的"最新版"是部署期注入的,而 release: published 事件同样不会因为
      # GITHUB_TOKEN 而触发工作流 → 显式重新部署一次。
      - name: Redeploy the site so it advertises the new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}" -f tag="$TAG"
