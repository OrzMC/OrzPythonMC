name: Release

on:
  push:
    tags: ["v*"]
  # release-please 用 GITHUB_TOKEN 建的 tag **不会触发工作流**(GitHub 的递归保护:
  # 由 GITHUB_TOKEN 产生的事件不再触发新的工作流运行),所以它建完 tag 后必须显式
  # dispatch 本工作流(见 release-please.yml)。手动补发也用同一个入口:
  #   gh workflow run release.yml --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布/补发的 tag(如 v2.1.0)
        required: true
        type: string

permissions:
  contents: write
  actions: write # 收尾时 dispatch pages.yml(同样是 GITHUB_TOKEN 不触发事件的问题)

# 同一时间只允许一个发版流程碰同一个 tag(矩阵 job 之间共享 draft release)。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 发版第一道护栏:tag 必须与代码里的版本一致,且指向 main 上的提交。
  # 不一致的代价极高:客户端自升级用 `releases/latest` 的 tag 和二进制内嵌
  # `__version__` 比较,版本对不上会变成「下载→替换→重启后版本没变→再提示升级」
  # 的死循环;PyPI 元数据、官网 latest 卡片、安装记录都会跟着错。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要完整历史做 merge-base(判断 tag 是否落在 main 上)。
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag matches the version in orzmc/version.py
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' orzmc/orzmc/version.py)"
          if [ -z "$version" ]; then
            echo "::error::cannot read __version__ from orzmc/orzmc/version.py"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match v$version (orzmc/version.py). Bump the version first, then tag."
            exit 1
          fi
          echo "ok: $TAG == v$version"
      - name: Tag commit is on main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 用 FETCH_HEAD 而不是 origin/main:手动 dispatch 时 checkout 落在 tag 上,
          # 那种 checkout 不一定有 refs/remotes/origin/main(实测报 unbound/unknown revision)。
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $TAG points at a commit that is not on main — release from main only."
            exit 1
          fi
          echo "ok: $GITHUB_SHA is on main"

  quality:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      # 6 平台 pytest 在 main push 已跑过;发版只取单 runner 质量门禁。
      skip-test-matrix: true

  # 先确保 Release 存在(draft),再挂二进制:
  #  - release-please 开的 release 已经带整理好的 notes 且已发布 → 原样不动;
  #  - 手动打 tag 时这里用 GitHub 生成的 notes 建 draft,发布前对用户不可见。
  prepare:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Ensure a draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving its notes and draft state untouched"
          else
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi

  binary:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            artifact: orzmc-macos-x86_64
          - os: macos-15
            arch: arm64
            artifact: orzmc-macos-arm64
          - os: ubuntu-latest
            arch: x86_64
            artifact: orzmc-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact: orzmc-linux-arm64
          - os: windows-latest
            arch: x86_64
            artifact: orzmc-windows-x86_64
          - os: windows-11-arm
            arch: arm64
            artifact: orzmc-windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # macOS runner 镜像预装 framework Python,uv 默认退回系统解释器 →
    # PyInstaller framework 模式(启动 ~14s)。强制 uv 只用 standalone 的 embed 模式(~1.5s)。
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build binary
        # --name 让每个平台产出独立文件名(orzmc-<os>-<arch>),Release 上不再互相覆盖
        run: uv run --package orzmc-app python scripts/build.py --name ${{ matrix.artifact }}
      - name: Assert embed-mode build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          if otool -L dist/orzmc* | grep -q "Python.framework"; then
            echo "::error::Binary links Python.framework (framework-mode PyInstaller, ~14s startup). Check pyproject.toml [tool.uv] python-preference = \"only-managed\"."
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/orzmc*
          if-no-files-found: error
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/orzmc* --clobber

  pypi:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build distributions
        run: uv build --all-packages
      # 按包拆分发布:每个包只用自己 scope 的 API token。
      # 注意 glob:dist/orzmc-* 不会误匹配 orzmc_app-*(下划线)。
      - name: Publish orzmc to PyPI
        run: uv publish dist/orzmc-*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN_ORZMC_LIB }}
      - name: Publish orzmc_app to PyPI
        run: uv publish dist/orzmc_app-*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN_ORZMC_APP }}

  # 收尾:二进制 + PyPI 全部落地后才让 Release 可见。
  # 半成品(有二进制、没 PyPI 包)不会出现在 releases/latest 上,官网与一键安装
  # 也不会提前把新版本推给用户。release-please 已发布的 release 上这是 no-op。
  publish:
    needs: [binary, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json tagName,isDraft,url \
            --jq '"published \(.tagName) draft=\(.isDraft) \(.url)"'
      # 官网的"最新版"是部署期注入的,而 release: published 事件同样不会因为
      # GITHUB_TOKEN 而触发工作流 → 显式重新部署一次。
      - name: Redeploy the site so it advertises the new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "$GITHUB_DEFAULT_BRANCH"
