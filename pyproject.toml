# Virtual workspace root: no [project] here — the packages live in orzmc/
# and orzmc_app/, and `uv build` at this root builds both members.

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "pyinstaller>=6.22.3",
    "psutil>=6.0",
]

[tool.uv]
# 只使用 uv 管理的 standalone Python(python-build-standalone,非 framework)。
# macOS CI runner 镜像预装 /Library/Frameworks/Python.framework(python.org 布局),
# uv 默认 python-preference 会在 managed 缺失时退回系统 Python → 建出的 venv 是
# framework 布局 → PyInstaller 打包进整个 Python.framework,frozen 启动 dlopen 它
# 要 ~14s(embed 模式仅 ~1.5s)。only-managed 从根上排除该分支。
python-preference = "only-managed"

[tool.uv.workspace]
members = ["orzmc", "orzmc_app"]

[tool.uv.sources]
orzmc = { workspace = true }
orzmc-app = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
# 生成文件：含中文全角标点（RUF001/RUF002 会误报），由 scripts/sync_compliance.py 生成。
"orzmc/orzmc/_compliance.py" = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["orzmc", "orzmc_app"]

[tool.pytest.ini_options]
testpaths = ["orzmc/tests", "orzmc_app/tests"]
addopts = "-q"
pythonpath = ["orzmc", "orzmc_app"]

[tool.mypy]
python_version = "3.10"
files = ["orzmc", "orzmc_app"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
